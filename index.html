<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09051b"><title>The Donut Landers</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell">
<header class="topbar"><div class="brand"><img src="assets/images/game-logo.png" alt="" onerror="this.style.display='none'"><div><h1>THE DONUT LANDERS</h1></div></div><button id="soundToggle" class="icon-button" aria-label="Toggle sound">🔊</button></header>
<section class="hud"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>BEST SCORE</span><strong id="best">0</strong></div><div><span>MOVES LEFT</span><strong id="moves">30</strong></div><div class="goal"><span>777 MATCH BONUS</span><strong>+7,777</strong></div></section>

<section class="board-wrap"><div class="board-title"><span>🍩 MATCH &amp; POP</span><span id="message" aria-live="polite">Match any 3 or more!</span></div><div id="board" class="board" role="grid" aria-label="Donut matching game"></div><div class="board-foot"><span>Match 3 or more horizontally or vertically</span><span>💥 Bigger matches = bigger points</span></div></section>
<section class="powerups">
<button id="shuffleBtn" class="power-btn"><span>🔀</span><b>Mix It Up</b><small>Shuffle board</small></button>
<button id="hintBtn" class="power-btn"><span>💡</span><b>Show Hint</b><small>Blink a match</small></button>
<button id="newGameBtn" class="power-btn"><span>🍬</span><b>New Game</b><small>30 fresh moves</small></button>
</section>
<footer><a href="https://www.TheDonutLanders.com" target="_blank" rel="noopener noreferrer">www.TheDonutLanders.com</a></footer></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-donut" id="modalIcon">🍩</div><p class="eyebrow" id="modalEyebrow">THE DONUT LANDERS</p><h2 id="modalTitle">Great Match!</h2><p id="modalText">You earned a bonus!</p><button id="modalOk" class="primary-btn">Let's play!</button></div></div>
<script src="game.js"></script></body></html>
